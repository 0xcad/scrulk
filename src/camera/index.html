<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Unlock camera helper</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 18px; background: Canvas; color: CanvasText; }
      main { display: grid; gap: 12px; }
      h1 { margin: 0; font: 700 16px/1.2 monospace; text-transform: uppercase; }
      p { margin: 0; font-size: 13px; line-height: 1.4; }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        transform: scaleX(-1);
        border-radius: 10px;
        background: #16161a;
      }
      button {
        justify-self: start;
        font: inherit;
        padding: 5px 12px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Scroll Unlock camera</h1>
      <video autoplay muted playsinline aria-label="Your camera preview"></video>
      <p data-status>Starting camera…</p>
      <p>This extension tab owns the camera permission. Tracked websites never request it.</p>
      <button type="button" data-retry hidden>retry camera access</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
