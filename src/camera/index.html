<!doctype html>
<html lang="en" class="scrulk-page-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Unlock camera helper</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/surfaces.css" />
    <link rel="stylesheet" href="../shared/buttons.css" />
    <style>
      .camera-page { padding: 18px; background: Canvas; color: CanvasText; }
      .camera-shell { display: grid; gap: 12px; }
      .camera-title { font-size: 16px; line-height: 1.2; }
      .camera-copy { margin: 0; font-size: 13px; line-height: 1.4; }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        transform: scaleX(-1);
        border-radius: 10px;
        background: #16161a;
      }
      button {
        justify-self: start;
        padding: 5px 12px;
      }
      [hidden] { display: none; }
    </style>
  </head>
  <body class="scrulk-page-body camera-page">
    <main class="camera-shell">
      <h1 class="scrulk-card-title camera-title">Scroll Unlock camera</h1>
      <video autoplay muted playsinline aria-label="Your camera preview"></video>
      <p class="camera-copy" data-status>Starting camera…</p>
      <p class="camera-copy">This extension tab owns the camera permission. Tracked websites never request it.</p>
      <button type="button" data-retry hidden>retry camera access</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
